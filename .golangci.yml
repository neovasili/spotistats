# Lint configuration for Spotistats (golangci-lint v1.x schema).
#
# Two rules here are load-bearing design constraints, not style preferences:
#
#   1. depguard encodes the package DAG from the milestone-2 plan. internal/model must
#      stay stdlib-only so the reconciler, the query Lambda and the CLI can share
#      period/aggregate math without dragging in Spotify or AWS. internal/spotify must
#      never import AWS (its refresh-token store is an interface, backed by SSM only at
#      the cmd layer) and must never import internal/store.
#
#   2. internal/httpx is generic transport shared by three API clients. It imports no other
#      internal package, or the MusicBrainz client would transitively depend on Spotify.
#
#   3. forbidigo bans time.RFC3339Nano. It strips trailing zeros, so a millisecond
#      instant .120 formats as ".12Z" and then sorts AFTER ".123Z" -- inverting the
#      chronological order of play sort keys and of firstPlayedAt/lastPlayedAt, which
#      are compared lexically. Use model.TimestampFormat (fixed 3-digit width) instead.

run:
  timeout: 3m
  tests: true

linters:
  enable:
    - depguard
    - forbidigo
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - copyloopvar

linters-settings:
  depguard:
    rules:
      # internal/model is the shared vocabulary: stdlib only.
      #
      # Test files are exempt. The constraint that matters is on model's importable
      # surface -- what a consumer transitively pulls in -- and test-only imports do
      # not propagate. The tests use go-cmp for readable []AggDelta diffs.
      model-stdlib-only:
        files:
          - "**/internal/model/*.go"
          - "!**/internal/model/*_test.go"
        allow:
          - $gostd
          - github.com/neovasili/spotistats/internal/model

      # internal/httpx is generic HTTP transport: retry, backoff, rate limiting. It is shared
      # by the Spotify, MusicBrainz and TheAudioDB clients, and it stays reusable only if it
      # knows about none of them. A single import of internal/spotify here would make the
      # MusicBrainz client depend transitively on Spotify.
      httpx-stays-generic:
        files:
          - "**/internal/httpx/**/*.go"
        allow:
          - $gostd
          - github.com/neovasili/spotistats/internal/httpx
        deny:
          - pkg: github.com/neovasili/spotistats/internal
            desc: "internal/httpx is generic transport and must not import any other internal package"
          - pkg: github.com/aws/aws-sdk-go-v2
            desc: "internal/httpx must not depend on AWS"

      # internal/spotify: no AWS, and never the store.
      spotify-no-aws-no-store:
        files:
          - "**/internal/spotify/**/*.go"
        deny:
          - pkg: github.com/aws/aws-sdk-go-v2
            desc: "internal/spotify must not depend on AWS; persist refresh tokens through the RefreshTokenStore interface instead"
          - pkg: github.com/aws/aws-sdk-go
            desc: "internal/spotify must not depend on AWS"
          - pkg: github.com/neovasili/spotistats/internal/store
            desc: "internal/spotify must not import internal/store (the package DAG is model <- spotify, model <- store)"

      # internal/store: never the Spotify client.
      store-no-spotify:
        files:
          - "**/internal/store/**/*.go"
        deny:
          - pkg: github.com/neovasili/spotistats/internal/spotify
            desc: "internal/store must not import internal/spotify (the package DAG is model <- spotify, model <- store)"

  forbidigo:
    exclude-godoc-examples: false
    forbid:
      - p: '\btime\.RFC3339Nano\b'
        msg: "time.RFC3339Nano strips trailing zeros (.120 -> .12Z), which inverts lexical ordering of timestamps used as DynamoDB sort keys. Use model.TimestampFormat / model.FormatTS."
      - p: '\btime\.RFC3339\b'
        msg: "time.RFC3339 has no fractional seconds, so distinct millisecond instants collide in a sort key. Use model.TimestampFormat / model.FormatTS."

  errcheck:
    check-type-assertions: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        # Tests assert on error paths where the response is nil by construction, which
        # bodyclose cannot prove. Production leak behaviour is covered directly by
        # TestRetrierClosesDiscardedBodies.
        - bodyclose
        # Deliberate discards in fixtures and assertions.
        - errcheck
