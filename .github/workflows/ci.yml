name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, and no secrets are referenced anywhere in this file. That is what makes it safe
# to run this workflow on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # golangci-lint must be built with a Go at least as new as go.mod's, or it refuses to
      # load the config at all. The v1 line tops out at a go1.24 build and cannot lint a
      # `go 1.26` module, so this is v2 -- see .golangci.yml for what the schema migration
      # did and did not change.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test-short:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Proves the pure suite really is pure: no Docker, no network, no AWS. If this job
      # ever needs a container, a dependency has leaked into internal/model or the
      # short-mode skip in storetest has stopped working.
      - name: go test -short
        run: make test-short

  test:
    name: Integration tests (DynamoDB Local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # SPOTISTATS_TEST_REQUIRE_DDB makes an unavailable Docker daemon a FAILURE rather
      # than a skip. Without it a broken runner would silently skip the entire integration
      # suite and report the build green.
      - name: go test (full)
        run: make test
        env:
          SPOTISTATS_TEST_REQUIRE_DDB: "1"

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  synth:
    name: Synthesise the CDK stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm install -g aws-cdk@2
      # No credentials and no context lookups: a template that only synthesises against a
      # real account is a template nobody can review. With no credentials the account falls
      # back to a placeholder, which is required because a cross-region reference (the
      # certificate ARN) cannot be resolved for an environment-agnostic stack.
      - name: cdk synth
        run: make synth
        env:
          # The zone ID is not in cdk.json (it is account-specific), and infra/config.go
          # rejects a domain with no zone rather than silently synthesising without alias
          # records. CI has no real zone, so it gets a documentation placeholder -- the same
          # trick as SynthOnlyAccount, and for the same reason: keep the template reviewable.
          SPOTISTATS_HOSTED_ZONE_ID: Z0123456789ABCDEFGHIJ

  fuzz:
    name: Fuzz the aggregate engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Every figure the site displays flows through AggregateDeltas, so it gets a short
      # fuzz run on every push rather than only when someone remembers to run `make fuzz`.
      - name: Fuzz
        run: make fuzz
