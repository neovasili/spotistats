name: Deploy

# MANUAL BY DEFAULT, on purpose.
#
# The repository is public, so a merge to main is no longer only the maintainer's doing. A
# human still has to press the button before anything reaches production.
#
# To switch to deploy-on-merge, uncomment the push block. Nothing else needs changing:
# the OIDC trust policy already scopes the role to refs/heads/main, so a push from any
# other branch cannot assume it -- and a fork's pull request cannot reach this workflow
# at all.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_data:
        description: 'Skip re-rendering snapshots (faster; use when only the frontend changed)'
        type: boolean
        default: false

# id-token is what lets the job mint an OIDC token; without it the AWS credential step
# fails with a message that does not mention permissions at all.
permissions:
  contents: read
  id-token: write

# Two concurrent deploys would race on the same CloudFormation stack, and the loser fails
# with an unhelpful "stack is in UPDATE_IN_PROGRESS". Never cancel one mid-flight, though:
# an interrupted cdk deploy leaves the stack needing manual recovery.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The gate before deploying: vet, the pure Go suite, and the frontend suite.
      #
      # The DynamoDB Local integration suite is deliberately NOT repeated here. It needs
      # Docker and takes minutes, and ci.yml already ran it against this exact code on the
      # pull request — main is post-merge. Re-running it would double the cost of every
      # deploy to re-prove something already proven.
      - name: Vet
        run: go vet ./...

      - name: Unit tests (no Docker)
        run: make test-short

      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          # Names the run in CloudTrail, so an audit shows which workflow made a change.
          role-session-name: gha-${{ github.run_id }}

      # This log is public, and the account ID would otherwise appear all over it: CDK prints
      # it when publishing assets ("Published ... (<account>-eu-west-1-...)"), in stack ARNs,
      # and in every ARN-valued stack output. Registering it as a mask once, here, covers all
      # of them -- masking any single command does not. GetCallerIdentity needs no IAM
      # permission, so the least-privilege deploy role can call it.
      - name: Mask the account ID in all subsequent logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      # Proves the OIDC hand-off worked and names the role. The account ID within the ARN is
      # replaced with *** by the mask registered above.
      - name: Verify the assumed identity
        run: aws sts get-caller-identity --query Arn --output text

      - run: npm install -g aws-cdk@2

      # Deploys both stacks. --require-approval never is safe here only because the role
      # itself is the guardrail: it cannot do more than deploy this application.
      - name: Deploy infrastructure
        run: make deploy-ci
        env:
          # cdk.json pins the region and domain; the account comes from the assumed role.
          CDK_DEFAULT_REGION: eu-west-1
          # Account-specific, so it is a secret and not committed to cdk.json. Without it the
          # both-or-neither check in infra/config.go fails the synth, which is the intended
          # behaviour -- far better than quietly deploying without any alias records.
          SPOTISTATS_HOSTED_ZONE_ID: ${{ secrets.AWS_HOSTED_ZONE_ID }}

      - name: Publish the frontend
        run: make deploy-web

      # Re-renders data/*.json from the current aggregates. Skippable when only the
      # frontend changed, since the snapshots would be byte-identical.
      - name: Re-render snapshots
        if: ${{ !inputs.skip_data }}
        run: make deploy-data

      # A deploy that "succeeded" while serving a 500 is not a successful deploy. This is the
      # cheap gate: the rendered page, the snapshot the dashboard reads, and one API route.
      - name: Smoke check (HTTP)
        run: |
          set -euo pipefail
          base=https://spotistats.neovasili.com
          for path in / /explore /data/dashboard.json /api/v1/meta; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$base$path")
            printf '%s  %s\n' "$code" "$path"
            [ "$code" = "200" ] || { echo "FAILED: $path returned $code"; exit 1; }
          done

      # The browser gate. A 200 proves the origin answered; it does not prove React mounted,
      # the snapshot parsed, or a chart survived real data — all of which serve a valid 200
      # with an empty page. Chromium only, and only after the HTTP check has already passed,
      # because the browser download is the most expensive step in the workflow.
      - name: Smoke check (browser)
        working-directory: web
        env:
          # The suite defaults to localhost so a contributor running `make smoke` does not
          # load the live site. A deploy check is the one place production is the right target.
          SMOKE_BASE_URL: https://spotistats.neovasili.com
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload smoke failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7
